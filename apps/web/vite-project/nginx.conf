server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # /api/* -> NestJS без префикса: /api/catalog/products -> api:3000/catalog/products.
    # Swagger доступен как /api/docs, фото роботов — /api/photos/R-101.webp
    location /api/ {
        proxy_pass http://api:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Без буферизации и с длинным таймаутом — под SSE-прогресс пересчёта
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Админка каталога живёт в API на том же пути, поэтому префикс сохраняем
    location /admin {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Хешированные ассеты Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA: любой путь отдаёт index.html, роутинг делает react-router
    location / {
        try_files $uri $uri/ /index.html;
    }
}
